[pytest]
; pythonpath (pytest >= 7) puts the project root on sys.path for every test
; process, so `import src...` / `import app...` resolve no matter which
; directory `pytest` is invoked from — no conftest.py sys.path hacks, no
; editable install required.
pythonpath = .
testpaths = tests
addopts = -v --strict-markers
