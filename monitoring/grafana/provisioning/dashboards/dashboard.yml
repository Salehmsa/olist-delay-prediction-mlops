# Section 10: tells Grafana to auto-load every dashboard JSON file from
# /var/lib/grafana/dashboards (docker-compose.yml mounts
# monitoring/grafana/dashboards/ there) on container start - the
# dashboard shows up already built, not as an empty Grafana instance you
# have to import a file into by hand.

apiVersion: 1

providers:
  - name: olist-dashboards
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
