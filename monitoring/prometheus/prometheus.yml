# Section 10: Prometheus scrapes the API's own /metrics endpoint
# (app/main.py's Instrumentator + src/monitoring/metrics.py) on a short
# interval - short enough that Grafana's dashboard and alerts.yml's rules
# both react quickly, still cheap at this service's traffic volume.
# `api` resolves via Docker Compose's own internal DNS, the same way
# MLFLOW_TRACKING_URI already resolves `mlflow` elsewhere in this project
# (docker-compose.yml) - no IP, no extra config.

global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: olist-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
