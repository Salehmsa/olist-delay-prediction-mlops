# Section 9: CI/CD.
#
#   test            lint (ruff) -> format check (black) -> pytest, on
#                    every push and pull request against main. Any failed
#                    step stops the job immediately (GitHub Actions'
#                    default - no continue-on-error anywhere below), which
#                    is what blocks build-and-push from ever running on a
#                    broken commit.
#   build-and-push   needs: test - only starts if every step above
#                    succeeded. Builds the API image and pushes it to
#                    GitHub Container Registry, tagged :latest and by
#                    commit SHA. Runs only on an actual push to main, not
#                    on pull requests (a PR from a fork couldn't push
#                    images anyway, and untrusted branches shouldn't).
#
# Why both jobs need a "CI dummy model" step - not the real
# models/final_model.pkl: that file is DVC-managed (Section 4) against a
# LOCAL folder on Saleh's own machine as its remote - unreachable from this
# runner. src/inference/model_registry.py and src/inference/pipeline.py
# both resolve a registered model AT IMPORT TIME (see tests/conftest.py's
# own docstring), so without *something* loadable at models/final_model.pkl,
# pytest collection itself crashes before a single test runs, and the
# register/api services would crash the same way at container startup.
# tests/fixtures/generate_ci_dummy_model.py builds a tiny (27KB), schema-
# correct binary classifier for exactly this - every test in tests/model/
# and tests/integration/ already asserts structural contracts (binary
# classifier, one prediction per row, probability in [0, 1], deterministic)
# rather than specific real-model predictions, by design (see that test
# file's own docstring), so the dummy satisfies all of them. This is a
# deliberate, common MLOps split, not a workaround: CI verifies the CODE
# wires together correctly; the REAL model is only ever used where its
# actual DVC remote is reachable - locally, or in Docker built locally -
# following the README's normal "Data & artifact versioning" + "Run with
# Docker" flow. Anyone pulling the image this workflow publishes gets a
# working service end to end, just answering with a placeholder model
# rather than the genuine trained one, and that's stated here on purpose
# rather than left to be discovered.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Provide the CI-only dummy model (see file header above)
        run: cp tests/fixtures/ci_dummy_model.pkl models/final_model.pkl

      - name: Tests (pytest)
        run: pytest -v

  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Provide the CI-only dummy model (see file header above)
        run: cp tests/fixtures/ci_dummy_model.pkl models/final_model.pkl

      - name: Compute a lowercase image name
        # GHCR (like every OCI registry) requires lowercase - github.repository
        # is Salehmsa/<repo>, capital S and all, so this can't be used as-is.
        run: echo "IMAGE_NAME=$(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
